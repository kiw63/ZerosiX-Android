name: Build ZerosiX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZerosiX APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 5. Cari ZIP source ZerosiX
      - name: Find ZerosiX source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Mencari source ZIP ZerosiX..."

          ZIP_FILE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%T@ %p\n" \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::Tidak ada file ZIP ZerosiX di root repository."
            exit 1
          fi

          echo "ZIP yang digunakan:"
          echo "${ZIP_FILE}"

          echo "ZIP_FILE=${ZIP_FILE}" >> "${GITHUB_ENV}"

      # 6. Extract ZIP
      - name: Extract ZerosiX source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/project"
          mkdir -p "${GITHUB_WORKSPACE}/project"

          unzip -q "${ZIP_FILE}" \
            -d "${GITHUB_WORKSPACE}/project"

          echo ""
          echo "Isi hasil extract:"
          find "${GITHUB_WORKSPACE}/project" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # 7. Cari settings.gradle
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "${GITHUB_WORKSPACE}/project" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit
          )"

          if [ -z "${SETTINGS_FILE}" ]; then
            echo "::error::settings.gradle.kts / settings.gradle tidak ditemukan."

            echo ""
            echo "Struktur project:"
            find "${GITHUB_WORKSPACE}/project" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"

          echo "Gradle project ditemukan:"
          echo "${PROJECT_DIR}"

          if [ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ] && \
             [ ! -f "${PROJECT_DIR}/app/build.gradle" ]; then

            echo "::error::app/build.gradle(.kts) tidak ditemukan."

            echo ""
            echo "Isi project:"
            find "${PROJECT_DIR}" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

          echo ""
          echo "PROJECT_DIR:"
          echo "${PROJECT_DIR}"

      # 8. Cek Gradle project sebelum build
      - name: Check Gradle project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GRADLE PROJECT CHECK"
          echo "========================================"

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "App:"
          ls -la app

          echo ""
          echo "Gradle files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            | sort

      # 9. Build APK
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING ZEROSIX APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug

      # 10. Cari APK hasil build
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          APK="$(
            find "${PROJECT_DIR}/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "${APK}" ]; then
            echo "::error::APK tidak ditemukan."

            echo ""
            echo "Isi build outputs:"
            find "${PROJECT_DIR}/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            echo ""
            echo "Isi app/build:"
            find "${PROJECT_DIR}/app/build" \
              -maxdepth 5 \
              -type f \
              | sort \
              | tail -200

            exit 1
          fi

          echo "APK ditemukan:"
          echo "${APK}"

          echo ""
          ls -lh "${APK}"

          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"

      # 11. Upload APK
      - name: Upload ZerosiX APK
        uses: actions/upload-artifact@v4
        with:
          name: ZerosiX-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
