name: Build ZerosiX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract ZerosiX source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n'             | sort -nr             | head -n 1             | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::Tidak ada source ZIP ZerosiX di repository root."
            exit 1
          fi

          echo "Source ZIP: ${ZIP_FILE}"

          rm -rf project
          mkdir -p project
          unzip -q "${ZIP_FILE}" -d project

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find project -type f \(             -name 'settings.gradle.kts' -o             -name 'settings.gradle'           \) -print -quit)"

          if [ -z "${SETTINGS}" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan setelah ZIP diekstrak."
            echo "Isi hasil ekstraksi:"
            find project -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS}")"

          if [ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ] &&              [ ! -f "${PROJECT_DIR}/app/build.gradle" ]; then
            echo "::error::Gradle app module tidak ditemukan."
            echo "Project directory: ${PROJECT_DIR}"
            find "${PROJECT_DIR}" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

          echo "Gradle project: ${PROJECT_DIR}"
          echo "Project files:"
          ls -la "${PROJECT_DIR}"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${APK}" ]; then
            echo "::error::app-debug.apk tidak ditemukan."
            echo "Output build:"
            find "${PROJECT_DIR}/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZerosiX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
